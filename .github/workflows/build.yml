name: Build apps

on:
  push:
    branches: [main]
    paths-ignore:
      - "series*.py"
      - "fitpage.py"
      - "test_fitpage.py"
      - "test_series*.py"
      - "SERIES_VERSION"
      - "SERIES_README.md"
      - ".github/workflows/build-series.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --upgrade pip pyinstaller pillow certifi rapidocr_onnxruntime tkinterdnd2
      - name: Self-test (grouping into 5-page folders)
        run: python test_core.py
      - name: Check the window code loads
        run: python -c "import app"
      - name: Open the window and try the Custom size boxes and the cover drop box
        run: python test_window.py

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --collect-data certifi --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all tkinterdnd2 --name ComicDownloader app.py
          Move-Item dist/ComicDownloader.exe ComicDownloader-Windows.exe
          Start-Process -FilePath ./ComicDownloader-Windows.exe -ArgumentList "--selftest","selftest.txt" -Wait
          Write-Host "Built app https test: $(Get-Content selftest.txt)"
          if ((Get-Content selftest.txt) -ne "OK") { exit 1 }

      - name: Build Mac app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --collect-data certifi --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all tkinterdnd2 --name ComicDownloader app.py
          dist/ComicDownloader.app/Contents/MacOS/ComicDownloader --selftest selftest.txt || true
          echo "Built app https test: $(cat selftest.txt)"
          grep -qx OK selftest.txt
          ditto -c -k --sequesterRsrc --keepParent dist/ComicDownloader.app ComicDownloader-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ComicDownloader-${{ runner.os }}
          path: |
            ComicDownloader-Windows.exe
            ComicDownloader-Mac.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(tr -d '[:space:]' < src/VERSION)"
          # the same version number replaces the old release of that number
          gh release delete "$V" --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh release create "$V" files/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Comic Downloader $V" \
            --notes "Windows: download ComicDownloader-Windows.exe. Mac: download ComicDownloader-Mac.zip. Step-by-step help is in the README."
