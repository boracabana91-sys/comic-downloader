name: Fetch NBA player pictures (vv13)

# Runs in the cloud, so nobody has to run anything on a Mac: it finds free-licence player pictures on Wikimedia
# Commons (from each player's own category), cuts out the background, keeps only clear one-player pictures and
# commits them to the branch together with a contact sheet to be checked.
on:
  push:
    branches: [sports-clipper-vv13]
    paths: [".github/fetch-args-vv13.txt", ".github/workflows/fetch-players-vv13.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip requests pillow numpy onnxruntime "rembg[cpu]" opencv-python-headless
      - name: Fetch and cut out
        working-directory: sports-clipper-vv13
        run: |
          ARGS="$(grep -v '^#' ../.github/fetch-args-vv13.txt | tr '\n' ' ')"
          mkdir -p ../out
          eval python tools/get_players.py --out ../out --shard ${{ matrix.shard }}/6 $ARGS 2>&1 | tee ../fetch-${{ matrix.shard }}.log
      - name: Commit this shard
        run: |
          mkdir -p sports-clipper-vv13/players
          cp -R out/. sports-clipper-vv13/players/
          cp fetch-${{ matrix.shard }}.log sports-clipper-vv13/players/_fetch-${{ matrix.shard }}.log
          git config user.name "players-bot"; git config user.email "players-bot@users.noreply.github.com"
          git add sports-clipper-vv13/players
          git commit -m "vv13: player pictures, shard ${{ matrix.shard }}" || echo "nothing new"
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((RANDOM % 10 + 3))
          done
