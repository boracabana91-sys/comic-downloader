name: Fetch NBA player pictures (vv11)

# Runs in the cloud, so nobody has to run anything on a Mac: it finds free-licence player pictures on Wikimedia
# Commons, cuts out the background and uploads them (plus a contact sheet) as an artifact to be checked and bundled.
on:
  push:
    branches: [sports-clipper-vv11]
    paths: [".github/fetch-args-vv11.txt", ".github/workflows/fetch-players-vv11.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip requests pillow numpy onnxruntime "rembg[cpu]"
      - name: Fetch and cut out
        working-directory: sports-clipper-vv11
        run: |
          ARGS="$(grep -v '^#' ../.github/fetch-args-vv11.txt | tr '\n' ' ')"
          eval python tools/get_players.py --out ../players_out $ARGS 2>&1 | tee ../fetch.log
      - name: Contact sheet
        run: python sports-clipper-vv11/tools/contact_sheet.py players_out contact.jpg
      - name: Commit the pictures to the branch
        run: |
          mkdir -p sports-clipper-vv11/players
          cp -R players_out/. sports-clipper-vv11/players/
          cp contact.jpg sports-clipper-vv11/players/_contact.jpg
          cp fetch.log sports-clipper-vv11/players/_fetch.log
          git config user.name "players-bot"; git config user.email "players-bot@users.noreply.github.com"
          git add sports-clipper-vv11/players
          git commit -m "vv11: player pictures (cloud fetch)" || echo "nothing new"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: players-vv11
          path: |
            players_out
            contact.jpg
            fetch.log
