name: Build EBZ CNVRBINE

on:
  push:
    branches: [main]
    paths:
      - "ebz/**"
      - ".github/workflows/build-ebz.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ebz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools (the same versions that were tested)
        run: python -m pip install --upgrade pip pyinstaller pillow==12.3.0 numpy==2.5.3 pypdfium2==5.13.0 pillow-heif==1.8.1 tkinterdnd2==0.6.4 resvg-py==0.5.0
      - name: Engine tests (snug fit on every device, PDF, CBZ, photos, EPUB from other programs, combine, covers)
        run: python test_ebz.py
      - name: Version 02 tests (EPUBs from other programs, DRM and text books refused, combine, covers)
        run: python test_v02.py
      - name: Updater tests (drop the new download to update; wrong files refused)
        run: python test_updater.py
      - name: Open the window, drop files, convert
        run: python test_ebz_window.py
      - name: Read the version number
        shell: bash
        run: echo "V=$(python -c 'import version; print(version.VERSION)')" >> "$GITHUB_ENV"

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --collect-all tkinterdnd2 --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-all pillow_heif --collect-all resvg_py --name EBZ-CNVRBINE ebz_app.py
          Move-Item dist/EBZ-CNVRBINE.exe "../EBZ-CNVRBINE-$env:V-Windows.exe"
          Start-Process -FilePath "../EBZ-CNVRBINE-$env:V-Windows.exe" -ArgumentList "--selftest","selftest.txt" -Wait
          Write-Host "Built app self-test: $(Get-Content selftest.txt)"
          if ((Get-Content selftest.txt) -ne "OK") { exit 1 }
          # real update test: an older copy of the program updates itself to this build
          $new = (Resolve-Path "../EBZ-CNVRBINE-$env:V-Windows.exe").Path
          New-Item -ItemType Directory -Force upd | Out-Null
          $old = Join-Path (Resolve-Path upd).Path "EBZ-CNVRBINE-00-Windows.exe"
          Copy-Item $new $old
          $res = Join-Path (Get-Location).Path "upd_result.txt"
          Start-Process -FilePath $old -ArgumentList "--apply-update",$new,"--no-launch","--result",$res -Wait
          Write-Host "Update test: $(Get-Content $res)"
          Get-ChildItem upd | ForEach-Object { Write-Host "  upd/$($_.Name)" }
          if (-not (Get-Content $res).StartsWith("OK")) { exit 1 }
          if (-not (Test-Path "upd/EBZ-CNVRBINE-$env:V-Windows.exe")) { exit 1 }
          if (-not (Test-Path "upd/EBZ-CNVRBINE-00-Windows.exe.old")) { exit 1 }

      - name: Build Mac app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --osx-bundle-identifier com.boracabana.ebzcnvrtr --collect-all tkinterdnd2 --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-all pillow_heif --collect-all resvg_py --name "EBZ CNVRBINE" ebz_app.py
          "dist/EBZ CNVRBINE.app/Contents/MacOS/EBZ CNVRBINE" --selftest "$PWD/selftest.txt" || true
          echo "Built app self-test: $(cat selftest.txt)"
          grep -qx OK selftest.txt
          ditto -c -k --sequesterRsrc --keepParent "dist/EBZ CNVRBINE.app" "../EBZ-CNVRBINE-$V-Mac.zip"
          # real update test: a copy of the app in an "Applications" folder updates itself from the zip
          mkdir -p upd/Apps upd/Trash
          ditto "dist/EBZ CNVRBINE.app" "upd/Apps/EBZ CNVRBINE.app"
          EBZ_TRASH="$PWD/upd/Trash" "upd/Apps/EBZ CNVRBINE.app/Contents/MacOS/EBZ CNVRBINE" --apply-update "$(cd .. && pwd)/EBZ-CNVRBINE-$V-Mac.zip" --no-launch --result "$PWD/upd_result.txt" || true
          echo "Update test: $(cat upd_result.txt)"
          ls -la upd/Apps upd/Trash
          grep -q '^OK' upd_result.txt
          ls upd/Trash | grep -q "EBZ CNVRBINE"
          "upd/Apps/EBZ CNVRBINE.app/Contents/MacOS/EBZ CNVRBINE" --version-file "$PWD/v.txt"
          echo "The updated app answers: $(cat v.txt | tr '\n' ' ')"
          grep -qx "EBZ CNVRBINE" v.txt

      - uses: actions/upload-artifact@v4
        with:
          name: EBZ-CNVRBINE-${{ runner.os }}
          path: |
            EBZ-CNVRBINE-*-Windows.exe
            EBZ-CNVRBINE-*-Mac.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="$(cd src/ebz && python3 -c 'import version; print(version.VERSION)')"
          V="ebz-v$N"
          # the same version number replaces the old release of that number
          gh release delete "$V" --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh release create "$V" files/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "EBZ CNVRBINE $N" \
            --notes "EBZ CNVRBINE (was EBZ CNVRTR). Windows: download EBZ-CNVRBINE-$N-Windows.exe. Mac: download EBZ-CNVRBINE-$N-Mac.zip. To update: drop the downloaded file on the 'Drop an update here' box at the top right of the program. A separate app from Comic Downloader and Comic Series Downloader. Help: ebz/README.md"
