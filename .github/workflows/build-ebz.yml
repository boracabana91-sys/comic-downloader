name: Build EBZ CNVRTR

on:
  push:
    branches: [main]
    paths:
      - "ebz/**"
      - ".github/workflows/build-ebz.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ebz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools (the same versions that were tested)
        run: python -m pip install --upgrade pip pyinstaller pillow==12.3.0 numpy==2.5.3 pypdfium2==5.13.0 pillow-heif==1.8.1 tkinterdnd2==0.6.4
      - name: Engine tests (snug fit on every device, PDF, CBZ, photos, EPUB)
        run: python test_ebz.py
      - name: Open the window, drop files, convert
        run: python test_ebz_window.py
      - name: Read the version number
        shell: bash
        run: echo "V=$(python -c 'import version; print(version.VERSION)')" >> "$GITHUB_ENV"

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --collect-all tkinterdnd2 --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-all pillow_heif --name EBZ-CNVRTR ebz_app.py
          Move-Item dist/EBZ-CNVRTR.exe "../EBZ-CNVRTR-$env:V-Windows.exe"
          Start-Process -FilePath "../EBZ-CNVRTR-$env:V-Windows.exe" -ArgumentList "--selftest","selftest.txt" -Wait
          Write-Host "Built app self-test: $(Get-Content selftest.txt)"
          if ((Get-Content selftest.txt) -ne "OK") { exit 1 }

      - name: Build Mac app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --osx-bundle-identifier com.boracabana.ebzcnvrtr --collect-all tkinterdnd2 --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-all pillow_heif --name "EBZ CNVRTR" ebz_app.py
          "dist/EBZ CNVRTR.app/Contents/MacOS/EBZ CNVRTR" --selftest "$PWD/selftest.txt" || true
          echo "Built app self-test: $(cat selftest.txt)"
          grep -qx OK selftest.txt
          ditto -c -k --sequesterRsrc --keepParent "dist/EBZ CNVRTR.app" "../EBZ-CNVRTR-$V-Mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: EBZ-CNVRTR-${{ runner.os }}
          path: |
            EBZ-CNVRTR-*-Windows.exe
            EBZ-CNVRTR-*-Mac.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N="$(cd src/ebz && python3 -c 'import version; print(version.VERSION)')"
          V="ebz-v$N"
          # the same version number replaces the old release of that number
          gh release delete "$V" --repo "${{ github.repository }}" --cleanup-tag --yes || true
          gh release create "$V" files/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "EBZ CNVRTR $N" \
            --notes "Windows: download EBZ-CNVRTR-$N-Windows.exe. Mac: download EBZ-CNVRTR-$N-Mac.zip, double-click to unzip. A separate app from Comic Downloader and Comic Series Downloader. Help: ebz/README.md"
