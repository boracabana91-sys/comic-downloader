name: Build Mac app

on:
  push:
    branches: [cattyfied]
    tags: ['cattyfied-v*']
  workflow_dispatch:

permissions:
  contents: write   # to publish Releases (fast, permanent downloads)

jobs:
  build:
    name: Build installers (Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - run: npm run build

      - name: Build for Apple Silicon (M1, M2, M3, M4…)
        run: |
          set -e
          V=$(node -p "require('@napi-rs/canvas/package.json').version")
          TARGET_ARCH=arm64 npm run prepare:binaries
          npm install --no-save --force @napi-rs/canvas-darwin-arm64@$V
          rm -rf node_modules/@napi-rs/canvas-darwin-x64
          npx electron-builder --mac --arm64 --publish never
          mv dist/Cattyfied-*-arm64.dmg "dist/Cattyfied-Apple-Silicon.dmg"
      - name: Build for Intel Macs
        run: |
          set -e
          V=$(node -p "require('@napi-rs/canvas/package.json').version")
          TARGET_ARCH=x64 npm run prepare:binaries
          npm install --no-save --force @napi-rs/canvas-darwin-x64@$V
          rm -rf node_modules/@napi-rs/canvas-darwin-arm64
          # the vocal-isolation runtime exists for Apple Silicon only: keep it out of the Intel app
          rm -rf node_modules/onnxruntime-node/bin/napi-v6/darwin/arm64
          npx electron-builder --mac --x64 --publish never
          mv dist/Cattyfied-*-x64.dmg "dist/Cattyfied-Intel.dmg"
      - name: Check both apps
        run: |
          set -e
          lipo -archs dist/mac-arm64/Cattyfied.app/Contents/MacOS/Cattyfied
          lipo -archs dist/mac-arm64/Cattyfied.app/Contents/Resources/bin/ffmpeg
          lipo -archs dist/mac/Cattyfied.app/Contents/MacOS/Cattyfied
          lipo -archs dist/mac/Cattyfied.app/Contents/Resources/bin/ffmpeg
          codesign --verify --deep --strict dist/mac-arm64/Cattyfied.app
          codesign --verify --deep --strict dist/mac/Cattyfied.app
          ls -la dist/*.dmg
      - name: Download for Apple Silicon Macs (M1, M2, M3, M4…)
        uses: actions/upload-artifact@v4
        with:
          name: Cattyfied-for-Apple-Silicon-Mac
          path: dist/Cattyfied-Apple-Silicon.dmg
          compression-level: 0
          retention-days: 30
      - name: Download for Intel Macs
        uses: actions/upload-artifact@v4
        with:
          name: Cattyfied-for-Intel-Mac
          path: dist/Cattyfied-Intel.dmg
          compression-level: 0
          retention-days: 30
      - name: Publish a Release (fast permanent download) when tagged
        if: startsWith(github.ref, 'refs/tags/cattyfied-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#cattyfied-}"
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          printf '\n---\n**Which one do I download?** Click the Apple menu  → About This Mac.\n- "Chip: Apple M…" → **Cattyfied-Apple-Silicon.dmg**\n- "Processor: Intel…" → **Cattyfied-Intel.dmg**\n\nThen open it and double-click **"Double-click me first"**.\n' >> notes.md
          gh release create "$TAG" dist/Cattyfied-Apple-Silicon.dmg dist/Cattyfied-Intel.dmg "installer/Start Here.html#Start-Here.html" \
            --repo "$GITHUB_REPOSITORY" --title "Cattyfied $VER" --notes-file notes.md --latest=false

  smoke-test:
    name: Install test on ${{ matrix.label }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            label: Apple Silicon
            dmg: Cattyfied-Apple-Silicon.dmg
            artifact: Cattyfied-for-Apple-Silicon-Mac
          - runner: macos-15-intel
            label: Intel
            dmg: Cattyfied-Intel.dmg
            artifact: Cattyfied-for-Intel-Mac
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
      - name: Install like a user would (copy + xattr), self-test, then launch
        run: |
          set -e
          DMG="${{ matrix.dmg }}"
          ls -la
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" "$DMG"
          hdiutil attach "$DMG" -nobrowse -mountpoint /Volumes/Cattyfied
          ls -la /Volumes/Cattyfied
          test -x "/Volumes/Cattyfied/Double-click me first.command"
          test -f "/Volumes/Cattyfied/Start Here.html"
          ditto /Volumes/Cattyfied/Cattyfied.app /Applications/Cattyfied.app
          xattr -cr /Applications/Cattyfied.app
          hdiutil detach /Volumes/Cattyfied
          echo "Machine: $(uname -m)"
          /Applications/Cattyfied.app/Contents/Resources/bin/ffmpeg -version | head -1
          if [ "$(uname -m)" = "arm64" ]; then MODE=full; else MODE=1; fi
          CATTY_SELFTEST=$MODE /Applications/Cattyfied.app/Contents/MacOS/Cattyfied 2>&1 | tee selftest.log
          grep -q "SELFTEST OK" selftest.log
          /Applications/Cattyfied.app/Contents/MacOS/Cattyfied > app.log 2>&1 &
          PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then echo "✅ Cattyfied started and stayed open"; kill $PID; else echo "❌ Cattyfied quit"; cat app.log; exit 1; fi
